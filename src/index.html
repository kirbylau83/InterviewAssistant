<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <header class="dashboard-header">
        <h1>Interview Dashboard</h1>
        <section class="timer-panel" aria-label="Interview timer">
          <div class="timer-label">Stopwatch</div>
          <div class="timer-display" id="timerDisplay">00:00</div>
          <div class="timer-controls" role="group" aria-label="Stopwatch controls">
            <button type="button" id="startButton">Start</button>
            <button type="button" id="stopButton" class="secondary">Stop</button>
            <button type="button" id="resetButton" class="secondary">Reset</button>
          </div>
        </section>
      </header>

      <section class="main-grid">
        <article class="panel talking-points">
          <h2>Main Talking Points</h2>
          <textarea spellcheck="false">
1) Snapshot intro (30 sec)
- 8+ years in B2B SaaS, consultative and MEDDICC-led
- Consistent attainment and expansion in complex accounts

2) Mid-market motion
- Land quickly, prove value in 90 days, expand with champions

3) Enterprise motion
- Multi-threaded engagement, executive alignment, mutual action plans

4) Core strengths
- Discovery depth, business case building, negotiation discipline

5) Close
- Why this company, why now, and what impact in first two quarters
          </textarea>
        </article>

        <aside class="panel camera-panel">
          <h2>Camera Space</h2>
          <div class="camera-slot">
            Keep this area open. Drag your interview app camera tile/window here.
          </div>
        </aside>

        <article class="panel qa-panel">
          <h2>Q/A (From Interviewer)</h2>
          <div class="qa-assistant-controls">
            <button type="button" id="recordQuestionButton">Start Recording</button>
            <button type="button" id="askAiButton" class="secondary">Ask AI</button>
          </div>
          <p class="qa-status" id="qaStatus">
            Record the interviewer question, then ask AI for a concise answer.
          </p>
          <label class="qa-label" for="interviewerQuestion">Live question transcript</label>
          <textarea id="interviewerQuestion" spellcheck="false" placeholder="Live transcript appears here..."></textarea>
          <label class="qa-label" for="aiAnswer">AI answer</label>
          <textarea id="aiAnswer" spellcheck="false" readonly placeholder="AI answer appears here..."></textarea>
          <label class="qa-label" for="aiApiKey">OpenRouter API key</label>
          <input
            id="aiApiKey"
            class="qa-input"
            type="password"
            placeholder="Paste OpenRouter API key (stored locally in this browser)"
            autocomplete="off"
          />
        </article>

        <article class="panel questions-panel">
          <h2>Questions (For Interviewer)</h2>
          <textarea spellcheck="false">
1) What does top performance look like in this territory over 12 months?
2) Where do deals most commonly stall in enterprise cycles?
3) How do sales, product, and CS partner on strategic accounts?
4) What are the biggest GTM priorities for the next two quarters?
          </textarea>
        </article>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
